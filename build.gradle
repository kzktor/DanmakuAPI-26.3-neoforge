plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

// The committed datagen output (item definitions, item models, lang, tags, damages, recipes) ships in
// the jar, exactly as upstream does. Without this the mod's items have no model or item definition at
// all, because models/item/*.json and items/*.json both live under src/generated/resources.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

dependencies {
    implementation project(':l2serial')
    implementation project(':l2core')
    implementation project(':registrate')
    implementation project(':l2damagetracker')
    implementation project(':l2menustacker')
    implementation project(':l2tabs')
    implementation project(':l2library')
    implementation project(':fast-projectile-api')
    runtimeOnly project(':l2itemselector')
    runtimeOnly project(':l2modularblock')
    // The src/test organizer tools (lang/resource/GUI generators) use Guava and Gson directly.
    testImplementation 'com.google.guava:guava:33.6.0-jre'
    testImplementation 'com.google.code.gson:gson:2.13.1'
    runtimeOnly files(rootProject.file('libs/curios-neoforge-17.0.0-beta.2+26.3-patched.jar'))
    compileOnly 'mezz.jei:jei-26.3-neoforge-api:31.9.0.56'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

// src/test holds the standalone lang/resource/GUI organizer tools, not JUnit tests.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version,
            neo_version_range   : neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
